<!doctype html>
<html lang="de" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d1322">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Lernheft">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-512.png">
<title>Lernheft</title>
<link rel="icon" href="icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Die Schriften blockieren den ersten Bildaufbau nicht: erst Systemschrift, sobald sie da sind, wird getauscht (display=swap). -->
<link rel="stylesheet" media="print" onload="this.media='all'" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Caveat:wght@600&family=STIX+Two+Text:ital,wght@0,400;0,600;1,400&display=swap">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Caveat:wght@600&family=STIX+Two+Text:ital,wght@0,400;0,600;1,400&display=swap"></noscript>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="app-kopf">
  <div class="app-kopf-innen">
    <a href="#/bibliothek" id="haus-knopf" class="rund-knopf haus-knopf" aria-label="Bibliothek" title="Bibliothek">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 11L12 4l8.5 7"/><path d="M5.5 9.5V20h4.5v-5.5h4V20h4.5V9.5"/></svg>
    </a>
    <div class="kopf-mitte">
      <div id="dok-tabs" class="dok-tabs" role="tablist" aria-label="Offene Skripte und Notizbücher"></div>
    </div>
    <div class="menue-wrap">
      <button id="menue-knopf" class="rund-knopf" type="button" aria-expanded="false" aria-controls="menue-liste" aria-label="Menü öffnen" title="Menü">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5.5" cy="12" r="1.6" class="voll"/><circle cx="12" cy="12" r="1.6" class="voll"/><circle cx="18.5" cy="12" r="1.6" class="voll"/></svg>
      </button>
      <nav id="menue-liste" class="menue-liste" aria-label="Hauptmenü" hidden>
        <a href="#/bibliothek" data-bereich="bibliothek">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 11L12 4l8.5 7"/><path d="M5.5 9.5V20h4.5v-5.5h4V20h4.5V9.5"/></svg>
          Bibliothek
        </a>
        <div id="menue-ordner" class="menue-ordner"></div>
        <button id="thema-knopf" class="menue-eintrag" type="button">
          <svg class="mond" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 019.5 4a8 8 0 1010.5 10.5z"/></svg>
          <svg class="sonne" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          <span>Helles Design</span>
        </button>
        <button id="sync-status" class="menue-eintrag ohne-linie" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7a2 2 0 012-2h4l2 2h8a2 2 0 012 2v8a2 2 0 01-2 2H5a2 2 0 01-2-2z"/></svg>
          <span>Speicherort</span>
        </button>
          <button id="menue-einstellungen" class="menue-eintrag" type="button">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.3 1.8l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.7 1.7 0 00-1.8-.3 1.7 1.7 0 00-1 1.5V21a2 2 0 11-4 0v-.1a1.7 1.7 0 00-1.1-1.5 1.7 1.7 0 00-1.8.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.7 1.7 0 00.3-1.8 1.7 1.7 0 00-1.5-1H3a2 2 0 110-4h.1a1.7 1.7 0 001.5-1.1 1.7 1.7 0 00-.3-1.8l-.1-.1a2 2 0 112.8-2.8l.1.1a1.7 1.7 0 001.8.3H9a1.7 1.7 0 001-1.5V3a2 2 0 114 0v.1a1.7 1.7 0 001 1.5 1.7 1.7 0 001.8-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.7 1.7 0 00-.3 1.8V9a1.7 1.7 0 001.5 1H21a2 2 0 110 4h-.1a1.7 1.7 0 00-1.5 1z"/></svg>
            Einstellungen
          </button>
      </nav>
    </div>
  </div>
</header>

<!-- Bibliothek: Ordner, Skripte und Notizbücher -->
<main id="ansicht-bibliothek" class="ansicht skripte-seite bib" hidden>
  <!-- Links: Name der App, Ansichten, Ordner, Papierkorb -->
  <aside class="bib-seite" aria-label="Bibliothek">
    <div class="bib-marke">Lernheft</div>
    <nav class="bib-nav" role="tablist" aria-label="Anzeigen">
      <button type="button" role="tab" data-reiter="alle"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7a2 2 0 012-2h4l2 2h8a2 2 0 012 2v8a2 2 0 01-2 2H5a2 2 0 01-2-2z" class="flaeche"/></svg><span>Dokumente</span></button>
      <button type="button" role="tab" data-reiter="favorit"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3.5h12v17l-6-4-6 4z"/><path d="M12 7.2l1.1 2.3 2.5.3-1.8 1.7.5 2.5-2.3-1.2-2.3 1.2.5-2.5-1.8-1.7 2.5-.3z"/></svg><span>Favoriten</span></button>
      <button type="button" role="tab" data-reiter="skript"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4"/><path d="M9 12h6M9 15.5h6"/></svg><span>Skripte</span></button>
      <button type="button" role="tab" data-reiter="notizbuch"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h12v18H6z"/><path d="M9 3v18"/><path d="M12 8h4M12 11.5h4"/></svg><span>Notizbücher</span></button>
      <button type="button" role="tab" data-reiter="whiteboard"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4.5" width="18" height="12" rx="1.5"/><path d="M8 20h8M12 16.5V20"/></svg><span>Whiteboards</span></button>
      <div class="bib-trenner" role="presentation"></div>
      <button type="button" role="tab" data-reiter="papierkorb" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M9.5 7V4.5h5V7M6 7l1 13h10l1-13"/><path d="M10 11v5.5M14 11v5.5"/></svg><span>Papierkorb</span></button>
    </nav>
    <p id="speicher-info" class="speicher-info"></p>
  </aside>
  <!-- Rechts: Suche und Einstellungen, Titel mit Neu und Sortierung, darunter die Dokumente -->
  <section class="bib-haupt">
    <div class="bib-werkzeuge">
      <label class="suche bib-suche">
        <span class="sr">In der Bibliothek suchen</span>
        <input id="suche" type="search" placeholder="In der Bibliothek suchen" autocomplete="off">
      </label>
      <button id="bib-such-knopf" class="bib-symbol" type="button" title="Suchen" aria-label="Suchen" aria-expanded="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M20 20l-4.8-4.8"/></svg>
      </button>
      <button id="bib-einst-knopf" class="bib-symbol" type="button" title="Einstellungen" aria-label="Einstellungen">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.3 1.8l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.7 1.7 0 00-1.8-.3 1.7 1.7 0 00-1 1.5V21a2 2 0 11-4 0v-.1a1.7 1.7 0 00-1.1-1.5 1.7 1.7 0 00-1.8.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.7 1.7 0 00.3-1.8 1.7 1.7 0 00-1.5-1H3a2 2 0 110-4h.1a1.7 1.7 0 001.5-1.1 1.7 1.7 0 00-.3-1.8l-.1-.1a2 2 0 112.8-2.8l.1.1a1.7 1.7 0 001.8.3H9a1.7 1.7 0 001-1.5V3a2 2 0 114 0v.1a1.7 1.7 0 001 1.5 1.7 1.7 0 001.8-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.7 1.7 0 00-.3 1.8V9a1.7 1.7 0 001.5 1H21a2 2 0 110 4h-.1a1.7 1.7 0 00-1.5 1z"/></svg>
      </button>
    </div>
    <div class="skripte-kopf">
      <div class="bib-titel-wrap">
        <nav id="pfad" class="pfad" aria-label="Ordnerpfad"></nav>
        <h1 id="bib-titel" class="bib-titel">Dokumente</h1>
      </div>
      <div class="skripte-aktionen">
        <button id="neu-knopf" class="btn-neu" type="button" aria-haspopup="menu">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg><span>Neu</span><svg class="pfeil" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 10l5 5 5-5"/></svg>
        </button>
        <button id="neuer-ordner" type="button" hidden>Neuer Ordner</button>
        <input id="pdf-datei" type="file" accept="application/pdf,.pdf" multiple hidden>
        <label class="sortierung">
          <span class="sr">Sortieren</span>
          <select id="sortierung">
            <option value="geoeffnet">Datum</option>
            <option value="name">Name</option>
            <option value="neu">Hinzugefügt</option>
          </select>
        </label>
      </div>
    </div>
    <div id="skripte-inhalt" class="skripte-inhalt"></div>
  </section>
</main>

<!-- Skripte und Notizbücher: Tabs oben, ein Dokument oder zwei nebeneinander -->
<main id="ansicht-dok" class="ansicht dok-ansicht" hidden>
  <div id="dok-leiste" class="dok-leiste-slot"></div>
  <div id="dok-bereiche" class="dok-bereiche">
    <div id="dok-teiler" class="dok-teiler" role="separator" aria-orientation="vertical" aria-label="Breite der beiden Dokumente ändern" tabindex="0" hidden></div>
  </div>
</main>

<template id="dok-vorlage">
  <section class="dok-bereich">
    <div data-el="werkzeuge" class="wb-leiste dok-leiste"></div>
    <div data-el="flaeche" class="dok-flaeche"></div>
    <p data-el="seitenanzeige" class="seitenanzeige" aria-live="polite"></p>
    <p data-el="meldung" class="dok-meldung" hidden></p>
  </section>
</template>

<dialog id="dialog" class="dialog"></dialog>
<div id="tooltip" class="tooltip" role="tooltip" hidden></div>



<script src="ui.js"></script>
<script src="daten.js"></script>
<script src="zeit.js"></script>
<script src="format.js"></script>
<script src="formen.js"></script>
<script src="leinwand.js"></script>
<script src="werkzeuge.js"></script>
<script src="pdfdienst.js"></script>
<script src="seitenleiste.js"></script>
<script src="umwandeln.js"></script>
<script src="bibliothek.js"></script>
<script src="dokument.js"></script>
<script src="geraet.js"></script>
<script src="app.js"></script>
</body>
</html>
