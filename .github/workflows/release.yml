# Baut das Windows-Paket und veröffentlicht ein Release.
# Von selbst, sobald auf main eine neue Version liegt (Programm/Quellcode/app/package.json geändert und für diese
# Version gibt es noch kein Release): der Tag v<Version> wird dabei angelegt. Ebenso beim Pushen eines Tags v<Version>
# oder von Hand (Actions › Release › Run workflow; baut das Paket der aktuellen Version neu).
# Gebaut wird wie am eigenen PC: npm run verteilen, npm run paket. Die Notizen kommen aus docs/Release-<Version>.md.
# Die Web-App fürs iPad veröffentlicht pages.yml (bei Änderungen auf main).
name: Release (Windows-Paket)
on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'Programm/Quellcode/app/package.json'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Version bestimmen
        id: version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="$(node -p "require('./Programm/Quellcode/app/package.json').version")"
          tag="v$v"
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "$tag" ]; then echo "Tag $GITHUB_REF_NAME passt nicht zur Version $v in Programm/Quellcode/app/package.json"; exit 1; fi
          if [ ! -f "docs/Release-$v.md" ]; then echo "docs/Release-$v.md fehlt: ohne Notizen kein Release"; exit 1; fi
          bauen=true
          # Auf main: nur, wenn es das Release noch nicht gibt (sonst löste jede Änderung an package.json einen Bau aus)
          if [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$GITHUB_REF_TYPE" = "branch" ] && gh release view "$tag" >/dev/null 2>&1; then bauen=false; echo "Release $tag gibt es schon."; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "bauen=$bauen" >> "$GITHUB_OUTPUT"
      - name: Tests (iPad-Teile, Formerkennung)
        if: steps.version.outputs.bauen == 'true'
        shell: bash
        run: |
          cd Programm/Quellcode/ipad
          npm ci --ignore-scripts
          npm test
          cd ../app
          node test/formen.js
      - name: Windows-App bauen
        if: steps.version.outputs.bauen == 'true'
        working-directory: Programm/Quellcode/app
        shell: bash
        env:
          LERNHEFT_OHNE_VERKNUEPFUNG: '1'
        run: |
          npm ci || npm install
          npm run verteilen
          npm run paket
      - name: Release veröffentlichen
        if: steps.version.outputs.bauen == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          zip="Veroeffentlichen/Lernheft-$V-Windows.zip"
          ls -l "$zip"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$zip" --clobber
            gh release edit "$TAG" --title "Lernheft $V" --notes-file "docs/Release-$V.md"
          else
            gh release create "$TAG" "$zip" --title "Lernheft $V" --notes-file "docs/Release-$V.md" --target "$GITHUB_SHA"
          fi
